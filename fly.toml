# fly.toml app configuration file generated for moodle-iugaza-monitor on 2026-10-01T12:25:19Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'moodle-iugaza-monitor'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
