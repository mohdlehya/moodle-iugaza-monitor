version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: moodle_postgres
    restart: always
    environment:
      POSTGRES_USER: moodle_user
      POSTGRES_PASSWORD: moodle_secure_password
      POSTGRES_DB: moodle_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle_user -d moodle_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: moodle_app
    restart: always
    ports:
      - "10000:10000"
    environment:
      DATABASE_URL: postgresql://moodle_user:moodle_secure_password@db:5432/moodle_db
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID}
      PORT: 10000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
